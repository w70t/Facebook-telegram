name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: تثبيت أدوات الاختبار
        run: pip install pytest pyflakes requests

      - name: فحص الصياغة
        run: python -m pyflakes *.py tests/*.py

      - name: الاختبارات
        run: python -m pytest -q

      - name: التأكد أن الأسرار مستثناة من git
        run: |
          set -e
          for f in settings.json pending.json x_cookies_someone.json user_session.session; do
            touch "$f"
            git check-ignore -q "$f" || { echo "❌ $f غير مستثنى في .gitignore"; exit 1; }
            rm -f "$f"
          done
          echo "✅ كل ملفات الأسرار مستثناة"
